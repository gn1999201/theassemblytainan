<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricity Usage — The Assembly Tainan</title>

<!-- 讓手機「加到主畫面」時看起來像一個 App -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Power Bill">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1976d2">
<link id="dynamic-manifest" rel="manifest">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    background: #f4f6f8;
    color: #1a1a1a;
    padding: 24px 16px;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    color: #555;
  }
  .cn { font-size: 11px; color: #aaa; display: block; font-weight: 400; margin-top: 2px; }
  .kwh {
    font-size: 48px;
    font-weight: 700;
    margin: 16px 0 0;
    color: #1976d2;
  }
  .kwh .unit { font-size: 18px; color: #999; margin-left: 4px; }
  .label { font-size: 13px; color: #888; margin-top: 4px; }
  .cost-box {
    margin-top: 24px;
    padding: 16px;
    background: #f0f7ff;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cost-box .amount { font-size: 24px; font-weight: 700; color: #d84315; }
  .meta {
    margin-top: 20px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
  .greeting {
    font-size: 15px;
    font-weight: 500;
    color: #1976d2;
    margin-bottom: 10px;
  }
  .reading-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #aaa;
    margin-top: 14px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .badge-active { background: #e8f5e9; color: #2e7d32; }
  .badge-closed { background: #eeeeee; color: #757575; }
  .live-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
  .live-heading {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .dot-active {
    background: #43a047;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(67,160,71, 0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(67,160,71, 0); }
    100% { box-shadow: 0 0 0 0 rgba(67,160,71, 0); }
  }
  .live-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .live-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 10px 4px;
  }
  .live-value { font-size: 18px; font-weight: 700; color: #333; }
  .live-label { font-size: 11px; color: #999; margin-top: 2px; }
  .live-hint {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
    text-align: center;
  }
  .closed-note {
    margin-top: 16px;
    padding: 12px 14px;
    background: #f7f7f7;
    border-radius: 10px;
    font-size: 12px;
    color: #888;
    text-align: center;
  }
  .error {
    color: #c62828;
    text-align: center;
    padding: 20px 0;
    font-size: 14px;
  }
  .loading {
    text-align: center;
    color: #999;
    padding: 40px 0;
  }
  .loading-hint {
    font-size: 12px;
    color: #bbb;
    margin-top: 8px;
  }
  .install-hint {
    max-width: 420px;
    margin: 12px auto 0;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: #6d5300;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .install-hint button {
    background: none;
    border: none;
    color: #6d5300;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .door-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
  .door-heading {
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }
  .door-code-display {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #1976d2;
    text-align: center;
    margin: 14px 0 6px;
    background: #f0f7ff;
    border-radius: 10px;
    padding: 12px;
  }
  .door-hint {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
  }
  .door-reset-btn {
    margin-top: 10px;
    width: auto;
    background: none;
    border: 1px solid #ddd;
    color: #888;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">
    Loading...
    <div class="loading-hint">This may take a moment, please wait</div>
  </div>
</div>

<div class="install-hint" id="installHint" style="display:none;">
  <span id="installHintText"></span>
  <button onclick="dismissInstallHint()" aria-label="Dismiss">&times;</button>
</div>

<script>
  // 這個網址不用改,已經指向你的 Apps Script 部署
  const API_BASE = 'https://script.google.com/macros/s/AKfycbxUb1u_77tPxJ4GU_Q7ZvpNq5CmKNyKQ1lfQ5ZhMZPijCowbqU-mC7roKnMU-Z3wnXxig/exec';

  // 從網址讀取這位房客的專屬 token,例如 ?token=roomb-0812-tw
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  // 動態產生 manifest,讓「加到主畫面」的捷徑能記住這位房客專屬的網址(含 token)
  (function setupManifest() {
    const iconUrl192 = new URL('icon-192.png', window.location.href).href;
    const iconUrl512 = new URL('icon-512.png', window.location.href).href;
    const iconUrl192Mask = new URL('icon-192-maskable.png', window.location.href).href;
    const iconUrl512Mask = new URL('icon-512-maskable.png', window.location.href).href;
    const manifest = {
      name: 'My Power Bill — The Assembly Tainan',
      short_name: 'My Power Bill',
      start_url: window.location.href,
      display: 'standalone',
      background_color: '#f4f6f8',
      theme_color: '#1976d2',
      icons: [
        { src: iconUrl192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: iconUrl512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: iconUrl192Mask, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: iconUrl512Mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('dynamic-manifest').setAttribute('href', URL.createObjectURL(blob));
  })();

  async function loadUsage(attempt) {
    attempt = attempt || 1;
    const card = document.getElementById('card');

    if (!token) {
      card.innerHTML = `<div class="error">This link is missing your access token.<br>Please use the personal link provided by your host.</div>`;
      return;
    }

    // 先看本機有沒有上次成功抓到的資料,有的話先顯示,不要讓房客對著空白 Loading 等
    const cacheKey = 'cached_view_' + token;
    if (attempt === 1) {
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        try {
          renderView_(JSON.parse(cached), true);
        } catch (e) { /* 快取壞掉就忽略,照常走正常流程 */ }
      }
    }

    try {
      const res = await fetch(API_BASE + '?token=' + encodeURIComponent(token));
      const data = await res.json();

      if (data.error) {
        // 如果已經有快取畫面顯示著,連線失敗就不要蓋掉它,悄悄放棄這次更新就好
        if (!localStorage.getItem(cacheKey)) {
          card.innerHTML = `<div class="error">${data.message}</div>`;
        }
        return;
      }

      localStorage.setItem(cacheKey, JSON.stringify(data));
      renderView_(data, false);

    } catch (e) {
      // Apps Script 剛啟動時不太穩定,自動重試最多 3 次,間隔越拉越長
      if (attempt < 3) {
        setTimeout(function () { loadUsage(attempt + 1); }, attempt * 2000);
        return;
      }
      // 有快取畫面顯示著的話,連線失敗也不要蓋掉它
      if (!localStorage.getItem(cacheKey)) {
        card.innerHTML = `
          <div class="error">
            Connection failed. Please try again.
            <div style="margin-top:12px;">
              <button onclick="loadUsage()" style="padding:8px 20px; border:none; border-radius:8px; background:#1976d2; color:#fff; font-size:14px; cursor:pointer;">Retry</button>
            </div>
          </div>`;
      }
    }
  }

  function renderView_(data, isStale) {
    const card = document.getElementById('card');
    const updated = new Date(data.updated_at);
    const timeStr = updated.toLocaleString('en-US', { hour12: true, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const staleNotice = isStale
      ? `<div style="text-align:center; font-size:11px; color:#1976d2; margin-bottom:8px;">Showing last known data — updating...</div>`
      : '';

    if (data.status === 'checked_out') {
      // ---- 已退房:顯示封存的最終帳單 ----
      card.innerHTML = `
        ${staleNotice}
        <span class="badge badge-closed">STAY COMPLETED</span>
        ${data.guest_name ? `<div class="greeting">Dear ${data.guest_name}, thank you for staying with us!</div>` : ''}
        <h1>${data.room_name} — Final Usage<span class="cn">${data.room_name} 最終用電量</span></h1>

        <div class="reading-row">
          <span>Starting reading: ${data.checkin_reading_kwh.toFixed(2)} kWh</span>
          <span>Final reading: ${data.final_reading_kwh.toFixed(2)} kWh</span>
        </div>

        <div class="kwh">${data.usage_kwh.toFixed(2)}<span class="unit">kWh</span></div>
        <div class="label">Total electricity used during your stay</div>

        <div class="cost-box">
          <div>
            <div class="label">Total Cost<span class="cn">總電費</span></div>
          </div>
          <div class="amount">NT$ ${data.estimated_cost_ntd}</div>
        </div>

        <div class="closed-note">
          Your stay has ended. This is your final electricity summary.
        </div>

        <div class="meta">Rate: NT$${data.rate_per_kwh}/kWh</div>
      `;
      return;
    }

    // ---- 入住中:顯示即時數據 ----
    const isActive = data.power_kw !== null && data.power_kw > 0.01;

    card.innerHTML = `
      ${staleNotice}
      <span class="badge badge-active">CURRENT STAY</span>
      ${data.guest_name ? `<div class="greeting">Dear ${data.guest_name}, welcome!</div>` : ''}
      <h1>${data.room_name} — Electricity Usage<span class="cn">${data.room_name} 用電量</span></h1>

      <div class="reading-row">
        <span>Starting reading: ${data.checkin_reading_kwh.toFixed(2)} kWh</span>
        <span>Current reading: ${data.current_reading_kwh.toFixed(2)} kWh</span>
      </div>

      <div class="kwh">${data.usage_kwh.toFixed(2)}<span class="unit">kWh</span></div>
      <div class="label">Electricity used during your stay so far</div>

      <div class="cost-box">
        <div>
          <div class="label">Estimated Cost<span class="cn">預估電費</span></div>
        </div>
        <div class="amount">NT$ ${data.estimated_cost_ntd}</div>
      </div>

      <div class="live-section">
        <div class="live-heading">
          <span class="dot ${isActive ? 'dot-active' : ''}"></span>
          Live Power Usage Right Now
          <span class="cn">即時用電狀況</span>
        </div>
        <div class="live-grid">
          <div class="live-item">
            <div class="live-value">${data.voltage_v ?? '—'}</div>
            <div class="live-label">Voltage (V)<span class="cn">電壓</span></div>
          </div>
          <div class="live-item">
            <div class="live-value">${data.current_a ?? '—'}</div>
            <div class="live-label">Current (A)<span class="cn">電流</span></div>
          </div>
          <div class="live-item">
            <div class="live-value">${data.power_kw ?? '—'}</div>
            <div class="live-label">Power (kW)<span class="cn">功率</span></div>
          </div>
        </div>
        <div class="live-hint">
          ${isActive
            ? 'Electricity is currently being used in this room.'
            : 'No significant power draw right now.'}
        </div>
      </div>

      ${renderDoorCodeSection_(data)}

      <div class="meta">
        Rate: NT$${data.rate_per_kwh}/kWh &nbsp;·&nbsp; Last updated ${timeStr}
      </div>
    `;
  }

  /**
   * 門鎖密碼區塊:
   * - 房間沒開通門鎖功能 → 不顯示這個區塊
   * - 這台裝置本機有存密碼 → 直接顯示密碼(不用重問伺服器,伺服器也沒存)
   * - 伺服器顯示已設定、但這台裝置沒有存(例如換了裝置) → 顯示提示 + 可以重設
   * - 還沒設定過 → 顯示輸入欄位讓房客自己選一組
   */
  function renderDoorCodeSection_(data) {
    if (!data.door_code_available) return '';
    doorCodeLength_ = data.door_code_length || 7;

    const savedCode = localStorage.getItem('door_code_' + token);

    if (data.door_code_set && savedCode) {
      return `
        <div class="live-section">
          <div class="live-heading">🔑 Your Door Code<span class="cn">你的門鎖密碼</span></div>
          <div class="kwh" style="font-size:34px; margin-top:6px;">${savedCode}</div>
          <div class="live-hint">Valid for your entire stay — use this code to unlock your room door.</div>
          <div style="text-align:center; margin-top:10px;">
            <button onclick="toggleDoorCodeForm_()" style="width:auto; padding:6px 16px; font-size:12px; border:1px solid #ddd; border-radius:8px; background:#fff; color:#666; cursor:pointer;">Change Code</button>
          </div>
          <div id="doorCodeFormWrap" style="display:none; margin-top:12px;">
            ${doorCodeInputForm_('Update Code')}
          </div>
        </div>
      `;
    }

    if (data.door_code_set && !savedCode) {
      return `
        <div class="live-section">
          <div class="live-heading">🔑 Door Code<span class="cn">門鎖密碼</span></div>
          <div class="live-hint" style="margin-bottom:8px;">A code was already set for this stay, but it isn't saved on this device. Set a new one below (this replaces the old one).</div>
          ${doorCodeInputForm_('Set Code')}
        </div>
      `;
    }

    // 還沒設定過
    return `
      <div class="live-section">
        <div class="live-heading">🔑 Set Your Door Code<span class="cn">設定門鎖密碼</span></div>
        <div class="live-hint" style="margin-bottom:8px;">Choose a 4-8 digit code to unlock your room during your stay.</div>
        ${doorCodeInputForm_('Set Code')}
      </div>
    `;
  }

  let doorCodeLength_ = 7; // 預設值,實際會被伺服器回傳的 door_code_length 覆蓋

  function doorCodeInputForm_(buttonLabel) {
    return `
      <div style="display:flex; gap:8px; width:100%;">
        <input type="tel" inputmode="numeric" id="doorCodeInput" maxlength="${doorCodeLength_}"
          placeholder="${doorCodeLength_} digits" style="flex:1; min-width:0; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:16px; letter-spacing:2px; box-sizing:border-box;">
        <button onclick="submitDoorCode()" id="doorCodeSubmitBtn"
          style="width:auto; flex-shrink:0; white-space:nowrap; padding:0 16px; border:none; border-radius:8px; background:#1976d2; color:#fff; font-size:14px; cursor:pointer;">${buttonLabel}</button>
      </div>
      <div id="doorCodeError" style="color:#c62828; font-size:12px; margin-top:6px;"></div>
    `;
  }

  function toggleDoorCodeForm_() {
    const wrap = document.getElementById('doorCodeFormWrap');
    if (wrap) wrap.style.display = (wrap.style.display === 'none') ? 'block' : 'none';
  }

  async function submitDoorCode() {
    const input = document.getElementById('doorCodeInput');
    const errorBox = document.getElementById('doorCodeError');
    const btn = document.getElementById('doorCodeSubmitBtn');
    const code = input.value.trim();

    if (!(new RegExp('^\\d{' + doorCodeLength_ + '}$')).test(code)) {
      errorBox.textContent = 'Code must be exactly ' + doorCodeLength_ + ' digits.';
      return;
    }

    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Setting...';
    errorBox.textContent = '';

    try {
      const res = await fetch(API_BASE + '?action=set_door_code&token=' + encodeURIComponent(token) + '&code=' + encodeURIComponent(code));
      const data = await res.json();

      if (data.error) {
        errorBox.textContent = data.message;
        btn.disabled = false;
        btn.textContent = originalLabel;
        return;
      }

      // 成功了:密碼只存在這台裝置本機,不會傳回伺服器儲存
      localStorage.setItem('door_code_' + token, data.code);
      loadUsage(); // 重新整理畫面,這次會直接顯示密碼

    } catch (e) {
      errorBox.textContent = 'Connection failed. Please try again.';
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  loadUsage();
  // 每 60 秒自動刷新一次(僅在入住中才有意義,已退房的畫面不會變)
  setInterval(loadUsage, 60000);

  // ---- 提示房客「加到主畫面」----
  (function showInstallHint() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const dismissed = localStorage.getItem('install_hint_dismissed_' + token);
    if (isStandalone || dismissed) return;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const text = isIOS
      ? 'Tip: Tap the Share icon below, then "Add to Home Screen" to check your usage anytime like an app.'
      : 'Tip: Tap the ⋮ menu above, then "Add to Home Screen" to check your usage anytime like an app.';

    document.getElementById('installHintText').textContent = text;
    document.getElementById('installHint').style.display = 'flex';
  })();

  function dismissInstallHint() {
    localStorage.setItem('install_hint_dismissed_' + token, '1');
    document.getElementById('installHint').style.display = 'none';
  }
</script>

</body>
</html>
