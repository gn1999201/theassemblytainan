<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Electricity Bookings</title>

<!-- 讓手機「加到主畫面」時看起來像一個 App -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookings Admin">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1976d2">
<link id="dynamic-manifest" rel="manifest">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    background: #f4f6f8;
    color: #1a1a1a;
    padding: 24px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 14px; color: #444; }
  label { display: block; font-size: 12px; color: #888; margin: 12px 0 4px; }
  select, input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #bbb; cursor: default; }
  button.secondary { background: #43a047; }
  button.danger { background: #d84315; }
  .result {
    margin-top: 14px;
    padding: 14px;
    background: #f0f7ff;
    border-radius: 10px;
    font-size: 13px;
    word-break: break-all;
  }
  .result a { color: #1976d2; }
  .copy-btn {
    margin-top: 8px;
    width: auto;
    display: inline-block;
    padding: 6px 14px;
    font-size: 12px;
    background: #333;
  }
  .booking-item {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .booking-item:last-child { border-bottom: none; }
  .booking-item .name { font-weight: 600; font-size: 14px; }
  .booking-item .meta { font-size: 12px; color: #888; margin-top: 2px; }
  .booking-item button {
    margin-top: 8px;
    margin-right: 8px;
    width: auto;
    padding: 6px 16px;
    font-size: 13px;
  }
  .empty { color: #999; font-size: 13px; text-align: center; padding: 20px 0; }
  .error { color: #c62828; font-size: 13px; margin-top: 10px; }
  .lock-screen {
    max-width: 320px;
    margin: 80px auto 0;
    text-align: center;
  }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="card">
    <h1>Admin Access</h1>
    <label>Admin key</label>
    <input type="password" id="adminKeyInput" placeholder="Enter your admin key">
    <button onclick="unlock()">Unlock</button>
    <div class="error" id="lockError"></div>
  </div>
</div>

<div id="mainApp" class="wrap" style="display:none;">
  <div class="card">
    <h1>New Guest Check-in</h1>
    <h2>Automatically reads the current meter and generates a personal link</h2>
    <label>Room</label>
    <select id="roomSelect"></select>
    <label>Guest name (optional)</label>
    <input type="text" id="guestNameInput" placeholder="e.g. William">
    <label>Starting reading (kWh)</label>
    <div style="display:flex; gap:8px;">
      <input type="number" step="0.01" id="checkinReadingInput" placeholder="Tap 'Read Meter' or type manually" style="flex:1;">
      <button type="button" onclick="readMeterNow()" id="readMeterBtn" style="width:auto; margin-top:0; white-space:nowrap; padding:0 16px;">Read Meter</button>
    </div>
    <div class="meta-hint" id="readMeterStatus" style="font-size:11px; color:#999; margin-top:4px;"></div>
    <label>Rate (NT$/kWh) — optional</label>
    <input type="number" step="0.1" id="rateInput" placeholder="Leave blank to use default rate">
    <button onclick="createBooking()" id="createBtn">Generate Link</button>
    <div id="createResult"></div>
  </div>

  <div class="card">
    <h1>Current Stays</h1>
    <h2>Tap Check Out to close a stay and lock in the final reading</h2>
    <div id="activeList"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
  const API_BASE = 'https://script.google.com/macros/s/AKfycbxUb1u_77tPxJ4GU_Q7ZvpNq5CmKNyKQ1lfQ5ZhMZPijCowbqU-mC7roKnMU-Z3wnXxig/exec';

  // 優先看網址裡有沒有帶 admin_key(這個比瀏覽器儲存空間更可靠,不會被系統自動清掉)
  // 沒有的話,退回看瀏覽器記住的舊值
  const urlParams = new URLSearchParams(window.location.search);
  let adminKey = urlParams.get('admin_key') || localStorage.getItem('admin_key') || '';

  function unlock() {
    const val = document.getElementById('adminKeyInput').value.trim();
    if (!val) return;
    adminKey = val;
    verifyAndEnter();
  }

  // 動態產生 manifest,讓「加到主畫面」的捷徑網址裡直接帶著 admin_key,
  // 這樣就算瀏覽器清掉本機儲存的密碼,捷徑本身還是能直接登入,不用重新輸入
  function setupManifest_() {
    const baseUrl = new URL(window.location.href);
    if (adminKey) {
      baseUrl.searchParams.set('admin_key', adminKey);
    }

    const iconUrl192 = new URL('icon-192.png', window.location.href).href;
    const iconUrl512 = new URL('icon-512.png', window.location.href).href;
    const iconUrl192Mask = new URL('icon-192-maskable.png', window.location.href).href;
    const iconUrl512Mask = new URL('icon-512-maskable.png', window.location.href).href;
    const manifest = {
      name: 'Bookings Admin — The Assembly Tainan',
      short_name: 'Bookings Admin',
      start_url: baseUrl.href,
      display: 'standalone',
      background_color: '#f4f6f8',
      theme_color: '#1976d2',
      icons: [
        { src: iconUrl192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: iconUrl512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: iconUrl192Mask, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: iconUrl512Mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('dynamic-manifest').setAttribute('href', URL.createObjectURL(blob));
  }
  setupManifest_();

  async function verifyAndEnter(attempt) {
    attempt = attempt || 1;
    try {
      const res = await fetch(API_BASE + '?action=list_rooms&admin_key=' + encodeURIComponent(adminKey));
      const data = await res.json();
      if (data.error) {
        document.getElementById('lockError').textContent = 'Incorrect admin key.';
        return;
      }
      localStorage.setItem('admin_key', adminKey);
      // 密碼確認有效後,把它也悄悄放進網址列(不會整頁重新整理),
      // 這樣「加到主畫面」抓到的網址就會自動帶著它
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('admin_key', adminKey);
      window.history.replaceState({}, '', newUrl);
      setupManifest_();

      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      populateRooms(data.rooms);
      loadActiveBookings();
    } catch (e) {
      // Apps Script 剛啟動時不太穩定,自動重試最多 3 次,間隔越拉越長
      if (attempt < 3) {
        document.getElementById('lockError').textContent = 'Connecting... (attempt ' + (attempt + 1) + ' of 3)';
        setTimeout(function () { verifyAndEnter(attempt + 1); }, attempt * 1500);
        return;
      }
      document.getElementById('lockError').textContent = 'Connection failed after several attempts. Please try again.';
    }
  }

  // 如果網址或瀏覽器已經有記住的 admin_key,直接嘗試自動登入,不用等使用者按 Unlock
  if (adminKey) {
    verifyAndEnter();
  }

  function populateRooms(rooms) {
    const sel = document.getElementById('roomSelect');
    sel.innerHTML = rooms.map(r => `<option value="${r}">${r}</option>`).join('');
  }

  async function readMeterNow(isRetry) {
    const room = document.getElementById('roomSelect').value;
    const btn = document.getElementById('readMeterBtn');
    const status = document.getElementById('readMeterStatus');

    btn.disabled = true;
    btn.textContent = '...';
    if (!isRetry) status.textContent = 'Reading meter, this can take a few seconds...';

    try {
      const res = await fetch(API_BASE + '?action=get_current_reading&room=' + encodeURIComponent(room) +
        '&admin_key=' + encodeURIComponent(adminKey));
      const data = await res.json();
      if (data.error) {
        status.innerHTML = `<span style="color:#c62828;">${data.message}</span>`;
      } else {
        document.getElementById('checkinReadingInput').value = data.reading_kwh.toFixed(2);
        status.innerHTML = `<span style="color:#2e7d32;">✓ Read successfully</span>`;
      }
    } catch (e) {
      // 這是唯讀動作,失敗不會有副作用,放心自動重試
      if (!isRetry) {
        status.textContent = 'Retrying...';
        setTimeout(function () { readMeterNow(true); }, 1500);
        return;
      }
      status.innerHTML = `<span style="color:#c62828;">Failed to read meter. Tap "Read Meter" to try again.</span>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Read Meter';
    }
  }

  async function createBooking() {
    const btn = document.getElementById('createBtn');
    const room = document.getElementById('roomSelect').value;
    const guestName = document.getElementById('guestNameInput').value.trim();
    const manualReading = document.getElementById('checkinReadingInput').value.trim();
    const rate = document.getElementById('rateInput').value.trim();
    const resultBox = document.getElementById('createResult');

    btn.disabled = true;
    btn.textContent = manualReading ? 'Creating...' : 'Reading meter...';
    resultBox.innerHTML = '';

    try {
      let url = API_BASE + '?action=create_booking&room=' + encodeURIComponent(room) +
        '&guest_name=' + encodeURIComponent(guestName) + '&admin_key=' + encodeURIComponent(adminKey);
      if (manualReading) {
        url += '&checkin_reading=' + encodeURIComponent(manualReading);
      }
      if (rate) {
        url += '&rate=' + encodeURIComponent(rate);
      }
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        resultBox.innerHTML = `<div class="error">${data.message}</div>`;
      } else {
        resultBox.innerHTML = `
          <div class="result">
            ${data.already_existed ? '<strong style="color:#d84315;">⚠ An active booking for this guest already existed — showing that link instead of creating a duplicate.</strong><br><br>' : ''}
            <strong>${data.room}${data.guest_name ? ' — ' + data.guest_name : ''}</strong><br>
            Starting reading: ${data.checkin_reading_kwh.toFixed(2)} kWh ${data.was_manual_reading ? '(manually entered)' : '(auto-read from meter)'}<br>
            Rate: NT$${data.rate_per_kwh}/kWh<br>
            Link: <a href="${data.guest_link}" target="_blank">${data.guest_link}</a>
            <br><button class="copy-btn" onclick="copyLink('${data.guest_link}')">Copy Link</button>
          </div>`;
        document.getElementById('guestNameInput').value = '';
        document.getElementById('checkinReadingInput').value = '';
        document.getElementById('rateInput').value = '';
        loadActiveBookings();
      }
    } catch (e) {
      resultBox.innerHTML = `<div class="error">Connection failed, but the request may have still gone through on the server.<br><strong>Check "Current Stays" below before clicking Generate Link again</strong> — retrying may create a duplicate booking.</div>`;
      loadActiveBookings();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Link';
    }
  }

  function copyLink(link) {
    navigator.clipboard.writeText(link);
  }

  async function loadActiveBookings(attempt) {
    attempt = attempt || 1;
    const list = document.getElementById('activeList');
    try {
      const res = await fetch(API_BASE + '?action=list_active&admin_key=' + encodeURIComponent(adminKey));
      const data = await res.json();
      if (data.error || !data.active_bookings.length) {
        list.innerHTML = `<div class="empty">No current stays.</div>`;
        return;
      }
      list.innerHTML = data.active_bookings.map(b => `
        <div class="booking-item" data-token="${b.token}" data-room="${b.room}">
          <div class="name">${b.room}${b.guest_name ? ' — ' + b.guest_name : ''}</div>
          <div class="meta">Token: ${b.token} · Check-in reading: ${b.checkin_reading_kwh.toFixed(2)} kWh</div>
          <button class="copy-btn" onclick="copyLink('${b.guest_link}')">Copy Link</button>
          <button class="danger" id="checkoutBtn_${b.token.replace(/[^a-zA-Z0-9]/g, '_')}" onclick="checkoutBooking('${b.token}')">Check Out</button>
        </div>
      `).join('');
    } catch (e) {
      if (attempt < 3) {
        setTimeout(function () { loadActiveBookings(attempt + 1); }, attempt * 1500);
        return;
      }
      list.innerHTML = `<div class="error">Failed to load current stays. <button onclick="loadActiveBookings()" style="width:auto; padding:6px 14px; font-size:12px;">Retry</button></div>`;
    }
  }

  let pendingCheckoutToken = null;

  async function checkoutBooking(token, isRetry) {
    pendingCheckoutToken = token;
    const btn = document.getElementById('checkoutBtn_' + cssSafe(token));
    if (btn) { btn.disabled = true; btn.textContent = 'Reading meter...'; }

    try {
      const bookingRoom = document.querySelector('[data-token="' + token + '"]').dataset.room;
      const res = await fetch(API_BASE + '?action=get_current_reading&room=' + encodeURIComponent(bookingRoom) +
        '&admin_key=' + encodeURIComponent(adminKey));
      const data = await res.json();

      if (data.error) {
        alert(data.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Check Out'; }
        return;
      }

      const confirmed = confirm(
        `Final meter reading: ${data.reading_kwh.toFixed(2)} kWh\n\nCheck out this guest with this reading? This cannot be undone.`
      );
      if (!confirmed) {
        if (btn) { btn.disabled = false; btn.textContent = 'Check Out'; }
        return;
      }

      // 這一步只是寫入試算表,速度快,失敗率低
      const finalizeRes = await fetch(API_BASE + '?action=checkout_booking&token=' + encodeURIComponent(token) +
        '&final_reading=' + encodeURIComponent(data.reading_kwh) + '&admin_key=' + encodeURIComponent(adminKey));
      const finalizeData = await finalizeRes.json();

      if (finalizeData.error) {
        alert(finalizeData.message);
      } else {
        alert(`Checked out. Final usage: ${finalizeData.usage_kwh.toFixed(2)} kWh — NT$${finalizeData.estimated_cost_ntd}`);
      }
      loadActiveBookings();

    } catch (e) {
      // 讀電表這步失敗可以放心重試(還沒寫入任何資料)
      if (!isRetry) {
        setTimeout(function () { checkoutBooking(token, true); }, 1500);
        return;
      }
      alert('Connection failed while reading the meter. Please try again — nothing has been written yet, so it is safe to retry.');
      if (btn) { btn.disabled = false; btn.textContent = 'Check Out'; }
    }
  }

  function cssSafe(str) {
    return str.replace(/[^a-zA-Z0-9]/g, '_');
  }
</script>

</body>
</html>
