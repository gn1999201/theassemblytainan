<style>
  :root{
    --ink:#1B2420; --ink-soft:#2A362F; --paper:#EFEBDA; --paper-dim:#E4DFCB;

    --line: rgba(27,36,32,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:'IBM Plex Sans','Noto Sans TC',sans-serif; line-height:1.6;
    min-height:100vh; display:flex; flex-direction:column;
  }
  h1,h2,.display{ font-family:'Zilla Slab','Noto Serif TC',serif; font-weight:600; margin:0; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 28px; width:100%; }
  .nav{ position:sticky; top:0; z-index:50; border-bottom:1px solid rgba(239,235,218,0.14); background:var(--ink); }
  .nav .wrap{ display:flex; align-items:center; justify-content:space-between; min-height:66px; gap:10px; padding-top:10px; padding-bottom:10px; }
  .brand{ font-family:'Zilla Slab','Noto Serif TC',serif; font-weight:700; font-size:1.15rem; letter-spacing:0.02em; white-space:nowrap; line-height:1; }
  .brand span{ color:var(--brick-soft); }
  .lang-link{
    font-family:'IBM Plex Sans',sans-serif; font-size:0.82rem; font-weight:600;
    background:none; border:1px solid rgba(239,235,218,0.4); color:var(--paper);
    padding:6px 12px; border-radius:999px; cursor:pointer; letter-spacing:0.03em;
    white-space:nowrap; line-height:1.3; text-decoration:none; flex-shrink:0;
  }
  .lang-link:hover{ background:rgba(239,235,218,0.1); }
  @media (max-width:420px){
    .brand{ font-size:0.98rem; }
    .lang-link{ font-size:0.72rem; padding:6px 9px; }
  }
  @media (max-width:360px){
    .brand{ font-size:0.85rem; }
    .lang-link{ font-size:0.66rem; padding:5px 8px; }
  }
  main{ flex:1; }
  .intro{ text-align:center; max-width:640px; margin:48px auto 48px; }
  .eyebrow{ font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:16px; line-height:1; }
  h1{ font-size:clamp(2.4rem,6vw,4rem); line-height:0.98; margin-bottom:16px; }
  h1 .accent{ color:var(--brick-soft); }
  .lead{ color:var(--paper-dim); font-size:1.05rem; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  @media (max-width:760px){
    .cards{
      display:flex; grid-template-columns:none; overflow-x:auto; gap:16px;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
      padding:4px 4px 12px; margin:0 -4px;
    }
    .cards::-webkit-scrollbar{ height:6px; }
    .cards::-webkit-scrollbar-thumb{ background:rgba(239,235,218,0.25); border-radius:3px; }
    .card{ flex:0 0 85%; scroll-snap-align:center; }
  }
  .card{
    display:block; text-decoration:none; color:var(--paper); background:var(--ink-soft);
    border:1px solid rgba(239,235,218,0.14); border-radius:3px; overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--gold); }
  .card-img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .card-body{ padding:24px; }
  .card-tag{ font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; }
  .card-title{ font-size:1.5rem; margin-bottom:10px; }
  .card-desc{ font-size:0.92rem; color:var(--paper-dim); margin-bottom:16px; }
  .card-cta{ font-size:0.9rem; font-weight:600; color:var(--brick-soft); }
  footer{ padding:24px 0; text-align:center; font-size:0.8rem; color:var(--paper-dim); border-top:1px solid rgba(239,235,218,0.12); }
